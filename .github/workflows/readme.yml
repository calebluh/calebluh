name: Render Profile Panels
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tickets.json"
      - "assets/*.webp"

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install Pillow
      - name: Render panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/readme.py
      - name: Commit updated panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/hud/ assets/items/ README.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh profile panels"
          git pull --rebase
          git push
