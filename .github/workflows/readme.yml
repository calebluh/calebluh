name: Sync Arcade GitHub HUD & Stats
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"

jobs:
  build-hud:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install Pillow
      - name: Generate Dynamic HUD Stat Images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/readme.py
      - name: Commit updated HUD stat images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/hud/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update live tickets and skills hud graphics"
          git push
