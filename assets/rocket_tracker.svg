<svg width="450" height="180" viewBox="0 0 450 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spaceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="450" height="180" rx="10" fill="url(#spaceGrad)" stroke="#3B82F6" stroke-width="2" />

  <!-- Twinkling Stars -->
  <circle cx="50" cy="30" r="1.5" fill="#FFFFFF" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" /></circle>
  <circle cx="180" cy="45" r="2" fill="#38BDF8" opacity="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" /></circle>
  <circle cx="350" cy="25" r="1" fill="#FFFFFF" opacity="0.6" />
  <circle cx="400" cy="70" r="1.5" fill="#F43F5E" opacity="0.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" /></circle>

  <!-- Title & Telemetry -->
  <text x="225" y="26" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="800">ORBITAL COMMIT VELOCITY</text>
  <text x="225" y="44" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Trajectory: Earth ➔ Mars Hohmann Transfer</text>

  <!-- Curved Orbital Path -->
  <path d="M 45 95 Q 225 40 405 95" fill="none" stroke="#1E293B" stroke-width="4" stroke-dasharray="6 4" />
  <path d="M 45 95 Q 225 40 280 72" fill="none" stroke="#3B82F6" stroke-width="4" filter="url(#glow)" />

  <!-- Earth Node -->
  <circle cx="45" cy="95" r="12" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2" />
  <text x="45" y="122" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">EARTH</text>

  <!-- Mars Node -->
  <circle cx="405" cy="95" r="10" fill="#B91C1C" stroke="#F87171" stroke-width="2" />
  <text x="405" y="122" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">MARS</text>

  <!-- Rocket Ship at Current Position -->
  <g transform="translate(268, 62) rotate(32)">
    <polygon points="-10,-4 12,0 -10,4 -4,0" fill="#F43F5E" filter="url(#glow)" />
    <polygon points="-14,-2 -10,0 -14,2" fill="#FB923C" />
  </g>

  <!-- Footer Stats Box -->
  <rect x="25" y="134" width="400" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="225" y="154" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">📍 DISTANCE: 34,280,000 MILES (84% TO MARS TARGET)</text>
</svg>