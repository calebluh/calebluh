<svg width="920" height="260" viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-layer { fill: #070B12; }
      .portrait-base { opacity: 1; transition: opacity 0.5s ease-in-out; }
      .portrait-alt { opacity: 0; transition: opacity 0.5s ease-in-out; }
      .banner-container:hover .portrait-base { opacity: 0; }
      .banner-container:hover .portrait-alt { opacity: 1; }
      .name-text { font-family: Impact, 'Arial Black', sans-serif; font-size: 58px; fill: #FFFFFF; letter-spacing: 2px; }
    </style>
    <clipPath id="bannerClip">
      <rect width="920" height="260" rx="12" />
    </clipPath>
  </defs>

  <g class="banner-container" clip-path="url(#bannerClip)">
    <!-- Background Frame -->
    <rect width="920" height="260" class="bg-layer" />

    <!-- Left Side: Normal Portrait Layer -->
    <g class="portrait-base">
      
    </g>

    <!-- Right Side / Hover State: Lacrosse / Alternate Layer -->
    <g class="portrait-alt">
      
    </g>

    <!-- Dark Gradient Vignette for Readability -->
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
    <rect width="920" height="260" fill="url(#vignette)" />

    <!-- Name Overlay Only -->
    <text x="55" y="150" class="name-text">CALEB LUH</text>
  </g>
</svg>